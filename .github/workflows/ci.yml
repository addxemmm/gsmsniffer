name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          go test -race ./...
          go build ./cmd/server
      - name: Publication surface check
        run: |
          node scripts/test_web_workflow.js
          node scripts/test_web_auth.js
          node scripts/test_web_transport.js
          python3 scripts/test_hub_tags.py
          python3 scripts/test_release_export.py
          python3 scripts/release_export.py --check-only --check-tracked
      - name: Build complete image (no push; demo smoke only)
        run: docker build --target runtime --build-arg VERSION="$(cat VERSION)" --build-arg REVISION="$GITHUB_SHA" -f deploy/docker/Dockerfile -t gsmsniffer:ci .
      - name: Anonymous and authenticated demo smoke (no RF)
        run: bash scripts/container_smoke.sh gsmsniffer:ci
